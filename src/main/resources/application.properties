spring.application.name=clinica

# Sem context-path: SPA na raiz (/) e API em /api/** (via WebMvcConfig PathPrefix)
server.port=${SERVER_PORT:8080}

# ==========================================
# Datasource (variáveis de ambiente Docker / local)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinica_estetica}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_clinica}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Clinica2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hibernate / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=clinica
spring.jpa.properties.jakarta.persistence.schema=clinica

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LEVEL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LEVEL:INFO}

# ==========================================
# Flyway
# ==========================================
spring.flyway.default-schema=clinica
spring.flyway.schemas=clinica
spring.flyway.create-schemas=${SPRING_FLYWAY_CREATE_SCHEMAS:true}
spring.flyway.locations=classpath:db/migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# Segurança e JWT
# ==========================================
api.security.token.secret=${JWT_SECRET:hOYF+u2/E+2EJE2j3sOt+86pIbUBsQ9rsynQM7Qmfew=}
spring.web.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:never}

# Springdoc sob o prefixo /api
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
