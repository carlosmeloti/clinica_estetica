services:
  db:
    image: postgres:16-alpine
    container_name: clinica-db
    environment:
      POSTGRES_DB: clinica_estetica
      POSTGRES_USER: app_clinica
      POSTGRES_PASSWORD: Clinica2026!
    ports:
      - "5432:5432"
    volumes:
      - clinica_pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_clinica -d clinica_estetica"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      # Contexto = pasta pai (frontend + clinica_estetica)
      context: ..
      dockerfile: clinica_estetica/Dockerfile
    container_name: clinica-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clinica_estetica
      SPRING_DATASOURCE_USERNAME: app_clinica
      SPRING_DATASOURCE_PASSWORD: Clinica2026!
      SPRING_FLYWAY_CREATE_SCHEMAS: "true"
      JWT_SECRET: hOYF+u2/E+2EJE2j3sOt+86pIbUBsQ9rsynQM7Qmfew=
      SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  clinica_pg_data:
